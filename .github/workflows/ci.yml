name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright

  # The property tests need minigun, which needs Python 3.12 or later
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: [ "3.12", "3.14" ]
    runs-on: ${{ matrix.os }}
    # Properties that start processes declare their attempts, which the time
    # budget does not limit; starting a process is slow on Windows, so it
    # makes a fifth of them (about 45 minutes otherwise)
    timeout-minutes: 30
    env:
      TICKLE_TEST_ATTEMPT_SCALE: ${{ matrix.os == 'windows-latest' && '0.2' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run minigun --time-budget 60

  # Tickle itself supports Python 3.11; run a small agenda end to end
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync
      - name: Offline, incremental rerun and clean
        run: |
          mkdir smoke && cd smoke
          echo hello > a.txt
          cat > agenda.yaml <<'EOF'
          procs:
            copy: [ python, ../tests/tasks/success.py, -i, $inputs, -o, $outputs ]
          flows:
            default: [ [ copy ] ]
          tasks:
          - desc: Copy a.txt
            proc: copy
            args: { inputs: [ a.txt ], outputs: [ out/b.txt ] }
            flows: [ default ]
            inputs: [ a.txt ]
            outputs: [ out/b.txt ]
          EOF
          uv run tickle offline
          test -f out/b.txt
          # Nothing changed, so the second run performs no task
          ! uv run tickle offline | grep -q "Copy a.txt"
          uv run tickle clean
          test ! -e out/b.txt
