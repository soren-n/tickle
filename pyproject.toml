[project]
name = "tickle-soren-n"
dynamic = ["version"]
description = "A command line workflow automation tool which performs task graph scheduling and concurrent task evaluation."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Soren Norbaek", email = "sorennorbaek@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=6.0.3",
    "watchdog>=7.1.0",
]

[project.urls]
Repository = "https://github.com/soren-n/tickle"
"Bug Tracker" = "https://github.com/soren-n/tickle/issues"

[project.scripts]
tickle = "tickle.cli:main"

[dependency-groups]
dev = [
    # minigun requires Python >= 3.12; the tests run on 3.12 and later.
    "minigun-soren-n>=6.6.0; python_version >= '3.12'",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "tickle/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["tickle", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["tickle"]

# Lint for bugs only; the code keeps its own formatting conventions (see
# CLAUDE.md), so no formatter is configured and style rules are off.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "B", "E9"]

[tool.pyright]
include = ["tickle"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
